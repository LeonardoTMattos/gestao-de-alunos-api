name: Testes de API

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Criar arquivo .env a partir do .env.example
        run: cp .env.example .env

      - name: Subir a API
        run: |
          npm start &
          for i in $(seq 1 30); do
            curl -s http://localhost:3000/ > /dev/null && exit 0
            sleep 1
          done
          echo "A API não subiu a tempo" && exit 1

      - name: Executar testes
        run: npm test
